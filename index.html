    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşkımın Çalışma Ekranı 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #ff6584;
            --secondary-color: #ff758c;
            --accent-color: #ff7eb3;
            --bg-gradient: linear-gradient(135deg, #fbc2eb 0%, #a1c4fd 100%);
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --success-color: #4cd137;
            --error-color: #e84118;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
        }

        /* Şifre Ekranı */
        #auth-screen {
            text-align: center;
            padding: 20px;
        }

        #auth-screen h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 26px;
        }

        #auth-screen input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        #auth-screen input:focus {
            border-color: var(--primary-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f1f2f6;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2f3640;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-item {
            padding: 14px 18px;
            border: 2px solid #f1f2f6;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            background: #fafafa;
        }

        .option-item:hover {
            border-color: var(--accent-color);
            background: #fff0f5;
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background: #ffe4e9;
        }

        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
        }

        .option-item.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24;
        }

        .feedback-box {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .feedback-box.correct-fb {
            background-color: #e8f8f5;
            color: #27ae60;
            border: 1px solid #a3e4d7;
        }

        .feedback-box.incorrect-fb {
            background-color: #fef9e7;
            color: #d68910;
            border: 1px solid #f9e79f;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 101, 132, 0.3);
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container h2 {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 15px;
        }

        .result-container p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .main-app {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ŞİFRE EKRANI -->
    <div id="auth-screen">
        <h2>💖 Aşkımın Çalışma Ekranı</h2>
        <p style="margin-bottom: 15px; color: #666;">Bu çalışma alanına sadece şifreyi bilenler girebilir aşkım! Şifreyi gir bakalım:</p>
        <input type="password" id="password-input" placeholder="Gizli Şifre (Örn: aşkım)">
        <button class="btn" onclick="checkPassword()">Giriş Yap ❤️</button>
    </div>

    <!-- ANA TEST UYGULAMASI (Şifre girilince açılır) -->
    <div class="main-app" id="main-app">
        <header>
            <h1 id="topic-title">💖 Aşkımın Çalışma Ekranı 💖</h1>
            <p id="question-counter">Soru 1 / 0</p>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </header>

        <div id="quiz-screen">
            <div class="question-box" id="question-text">Yükleniyor...</div>
            <ul class="options-list" id="options-list"></ul>
            <div class="feedback-box" id="feedback-box"></div>
            <button class="btn" id="next-btn" disabled>Sonraki Soru</button>
        </div>

        <div class="result-container" id="result-screen">
            <h2>Test Tamamlandı! 🎉</h2>
            <p id="score-text"></p>
            <button class="btn" onclick="restartQuiz()">Yeniden Çöz ❤️</button>
        </div>
    </div>
</div>

<script>
    // 🔑 ŞİFREYİ BURADAN DEĞİŞTİREBİLİRSİN

                {q:"Fetihten sonra Rum patriği olarak kim atandı?",options:["Ovakim","Notaras","Amirutzes","Gennadios"],answer:3,note:"Ermeni patriği ise Ovakim oldu."},

    ];

    const PRAISE = ["Harikasın! 🎉", "Aynen böyle devam! 💪", "Bravo, tam isabet! ⭐", "Çok iyisin, gurur duyuyorum! 💖", "Mükemmel! Sen bunu yaparsın! 🌟", "Süpersin! Hiç durma! 🚀"];
    const COMFORT = ["Sorun değil, hata öğrenmenin parçası. 💛", "Pes yok, bir sonrakini alırsın! 💪", "Şimdi öğrendin, sınavda unutmazsın. 🌱", "Sana inanıyorum, devam! ✨", "Herkes yanılır, önemli olan vazgeçmemek. 🤍", "Bir adım geri, iki adım ileri! 🌈"];

    let currentTopicIndex = 0;
    let questions = [];
    let currentQuestion = 0;
    let score = 0;
    let selectedOption = null;
    let isAnswered = false;

    function checkPassword() {
        const val = document.getElementById("password-input").value;
        if (val === SECRET_PASSWORD) {
            document.getElementById("auth-screen").style.display = "none";
            document.getElementById("main-app").style.display = "block";
            initQuiz();
        } else {
            alert("Şifre yanlış aşkım, bir daha dene! ❤️");
        }
    }

    const questionText = document.getElementById("question-text");
    const optionsList = document.getElementById("options-list");
    const nextBtn = document.getElementById("next-btn");
    const feedbackBox = document.getElementById("feedback-box");
    const questionCounter = document.getElementById("question-counter");
    const progressBar = document.getElementById("progress");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const scoreText = document.getElementById("score-text");
    const topicTitle = document.getElementById("topic-title");

    function initQuiz() {
        // Tüm konuları birleştirip ya da sırayla sunabiliriz; şimdilik ilk konudan veya tümünden soruları alalım:
        // Hepsini tek havuz yapmak istersen: TOPICS icindeki tum soruları alabiliriz. 
        // Şimdilik konulardaki soruları birleştirelim:
        questions = [];
        TOPICS.forEach(t => {
            questions = questions.concat(t.questions);
        });
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        selectedOption = null;
        feedbackBox.style.display = "none";
        nextBtn.disabled = true;
        nextBtn.textContent = "Sonraki Soru";

        const q = questions[currentQuestion];
        questionText.textContent = `${currentQuestion + 1}. ${q.q}`;
        questionCounter.textContent = `Soru ${currentQuestion + 1} / ${questions.length}`;
        progressBar.style.width = `${(currentQuestion / questions.length) * 100}%`;

        optionsList.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.textContent = opt;
            li.onclick = () => selectOption(index, li);
            optionsList.appendChild(li);
        });
    }

    function selectOption(index, element) {
        if (isAnswered) return;
        document.querySelectorAll(".option-item").forEach(el => el.classList.remove("selected"));
        element.classList.add("selected");
        selectedOption = index;
        nextBtn.disabled = false;
    }

    nextBtn.onclick = function() {
        if (!isAnswered) {
            if (selectedOption === null) return;
            isAnswered = true;
            const q = questions[currentQuestion];
            const optionItems = document.querySelectorAll(".option-item");

            feedbackBox.style.display = "block";

            if (selectedOption === q.answer) {
                optionItems[selectedOption].classList.add("correct");
                const randomPraise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
                feedbackBox.className = "feedback-box correct-fb";
                feedbackBox.innerHTML = `<strong>Tebrikler aşkım çok zekisin ❤️</strong><br>${randomPraise}`;
                score++;
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
            } else {
                optionItems[selectedOption].classList.add("incorrect");
                optionItems[q.answer].classList.add("correct");
                const randomComfort = COMFORT[Math.floor(Math.random() * COMFORT.length)];
                let explanationText = q.note ? `<br><em>Not: ${q.note}</em>` : "";
                feedbackBox.className = "feedback-box incorrect-fb";
                feedbackBox.innerHTML = `<strong>Minik bir hata ama süpersin!</strong> ${randomComfort}${explanationText}`;
            }

            if (currentQuestion < questions.length - 1) {
                nextBtn.textContent = "Sonraki Soruya Geç";
            } else {
                nextBtn.textContent = "Sonuçları Gör";
            }
        } else {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }
    };

    function showResults() {
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";
        progressBar.style.width = "100%";
        scoreText.innerHTML = `${questions.length} sorudan <b>${score}</b> doğru yaptın!<br>Seni çok seviyorum, harika hazırlandın! ❤️`;
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        resultScreen.style.display = "none";
        quizScreen.style.display = "block";
        loadQuestion();
    }
</script>
