<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşkımın Çalışma Ekranı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #fbc2eb 0%, #a1c4fd 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #4a4a4a; }
        .container { width: 100%; max-width: 650px; background: #ffffff; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 30px; }
        .screen { display: none; }
        #auth-screen { display: block; text-align: center; padding: 20px; }
        #auth-screen h2 { color: #ff6584; margin-bottom: 15px; font-size: 26px; }
        #auth-screen input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 15px; outline: none; }
        .btn { background: linear-gradient(135deg, #ff6584, #ff758c); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 5px 15px rgba(255,101,132,0.3); }
        .category-list { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .category-card { padding: 18px 20px; border: 2px solid #f1f2f6; border-radius: 16px; cursor: pointer; background: #fafafa; display: flex; justify-content: space-between; align-items: center; }
        .category-card h3 { font-size: 16px; color: #2f3640; }
    </style>
</head>
<body>

<div class="container">
    <!-- GİRİŞ EKRANI -->
    <div id="auth-screen" class="screen">
        <h2>💖 Çalışma Ekranı</h2>
        <p style="margin-bottom: 15px; color: #666;">Şifreyi gir:</p>
        <input type="password" id="password-input" placeholder="Şifre">
        <button class="btn" onclick="checkPassword()">Giriş Yap</button>
    </div>

    <!-- KATEGORİ EKRANI -->
    <div id="category-screen" class="screen">
        <h2 style="color: #ff6584; margin-bottom: 10px;">📚 Konu Seçimi</h2>
        <p id="user-welcome-sub" style="color: #666; font-size: 14px; margin-bottom: 10px;"></p>
        <div class="category-list" id="category-list"></div>
    </div>
</div>

<script>
    const PASS_ASKIM = "aşkım";       
    const PASS_KANKA = "aşkım1";       

    const TOPICS = [
        {
            name: "Osmanlı Yükselme Dönemi",
            questions: [
                {q:"Fatih Sultan Mehmet'in mahlası nedir?",options:["Muhibbi","Avni","Fuzuli","Baki"],answer:1,note:"Fatih 'Avni' mahlasını kullandı."}
            ]
        }
    ];

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
        const target = document.getElementById(screenId);
        if (target) target.style.display = 'block';
    }

    function checkPassword() {
        const inputEl = document.getElementById("password-input");
        if (!inputEl) return;
        const val = inputEl.value.trim();

        if (val === PASS_ASKIM || val === PASS_KANKA) {
            showCategories();
        } else {
            alert("Hatalı şifre, bir daha dene!");
            inputEl.value = "";
        }
    }

    function showCategories() {
        const listDiv = document.getElementById("category-list");
        if (!listDiv) return;
        listDiv.innerHTML = "";
        TOPICS.forEach((topic, index) => {
            const card = document.createElement("div");
            card.className = "category-card";
            card.innerHTML = `<h3>📚 ${topic.name}</h3><span>${topic.questions.length} Soru</span>`;
            listDiv.appendChild(card);
        });
        showScreen('category-screen');
    }
</script>

</body>
</html>
